name: SteamStats
options:
  bundleIdPrefix: com.steamstats
  deploymentTarget:
    iOS: 17.0
targets:
  SteamStats:
    type: application
    platform: iOS
    sources:
      - SteamStats
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.steamstats.SteamStats
      INFOPLIST_FILE: SteamStats/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - SteamStatsTests
  SteamStatsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SteamStatsTests
    dependencies:
      - target: SteamStats
